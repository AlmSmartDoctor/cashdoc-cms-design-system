name: Release

# main push 자동 릴리즈 제거 — 수동 dispatch 전용 (#53).
# 릴리즈 판단(버전 타입 포함)은 사람이 트리거 시점에 결정한다.
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write
  id-token: write

# 동시 dispatch 시 버전 bump/push 경합 방지
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 버전 bump 커밋을 보호된 main에 직접 push해야 하므로 브랜치
          # 보호를 우회할 수 있는 관리자 PAT(RELEASE_TOKEN)로 checkout.
          # RELEASE_TOKEN 이 없으면 기존 동작(GITHUB_TOKEN)으로 폴백한다.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 릴리즈 전 최소 게이트: 게이트가 없으면 CI 실패 상태로도 배포된다.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Bump version and generate changelog
        run: |
          set -euo pipefail

          case "${{ github.event.inputs.release-type }}" in
            major)
              pnpm release:major
              ;;
            minor)
              pnpm release:minor
              ;;
            patch|"")
              pnpm release:patch
              ;;
            *)
              echo "::error::Unsupported release type: ${{ github.event.inputs.release-type }}"
              exit 1
              ;;
          esac

      - name: Push changes
        run: |
          git push --follow-tags origin main

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            🎉 New version released!

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
